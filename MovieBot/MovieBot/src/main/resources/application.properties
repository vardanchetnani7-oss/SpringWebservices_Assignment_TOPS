spring.application.name=movie-bot
# Task 1: the API key is NOT written here. This line reads it from an environment
# variable called GEMINI_API_KEY, so the real key never ends up in your code or on GitHub.
# If the variable is missing, the value is empty and the endpoint returns a clear error.
gemini.api.key=${GEMINI_API_KEY:}

# Which Gemini model to call
gemini.model=gemini-3.5-flash
spring.config.import=optional:file:./secrets.properties
